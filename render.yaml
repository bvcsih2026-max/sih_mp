services:
  - type: web
    name: mplads-guardian-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: mplads-guardian-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FRONTEND_URLS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/mplads_guardian.db
